<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THIS IS A — Coming Soon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg: #f6f5f3;
            --text: #1f1f1f;
            --muted: #666;
            --accent: #b38f5a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
        }

        main {
            max-width: 520px;
            padding: 2.5rem 2rem;
            text-align: left;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 0.08em;
            margin: 0 0 1.5rem 0;
            font-weight: 700;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            margin: 0 0 1rem 0;
        }

        .muted {
            color: var(--muted);
        }

        a {
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
        }

        a:hover {
            color: var(--accent);
        }

        footer {
            margin-top: 2.5rem;
            font-size: 0.85rem;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <main>
        <h1>THIS IS A</h1>

        <p>
            A visual guide to construction essentials.
            Exploring materials, systems and the craft of architectural
            drawing.
        </p>

        <p class="muted">
            Launching soon.
        </p>

        <p>
            Follow updates on
            <a href="https://www.linkedin.com/in/joerharris" target="_blank" rel="noopener">
                LinkedIn
            </a>.
        </p>

        <footer>
            &copy; 2025 Joe Harris
        </footer>
    </main>
</body>
</html>
